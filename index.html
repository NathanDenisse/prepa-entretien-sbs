if avec X nouveaux clients. Ce que j'aime, c'est le cycle court : un besoin, une solution, un résultat visible vite. Je veux maintenant le faire sur un sujet qui compte vraiment pour mes clients : le recrutement. »",piege:"Raconter son CV dans l'ordre depuis le bac. Le recruteur l'a déjà lu."},{question:"Pourquoi Indeed ?",version_sbs:"Pourquoi Indeed, et pourquoi l'équipe des petites entreprises ?",ce_qu_ils_evaluent:"Si tu t'es renseignée, et si ta motivation va au-delà de la marque.",structure:["La mission : aider les gens à trouver un emploi [s:indeed-carrieres]. C'est concret et utile.","Les petites entreprises : un recrutement y compte beaucoup, et ton conseil a un effet visible.","Toi : le rythme de vente et le contact client te correspondent."],piege:"« Parce que c'est le numéro 1. »"},{question:"Que savez-vous de notre entreprise ?",version_sbs:"Expliquez-nous en une minute comment Indeed gagne de l'argent avec une petite entreprise.",ce_qu_ils_evaluent:"Ta compréhension du modèle, pas ta capacité à réciter des chiffres.",structure:["Les candidats utilisent Indeed gratuitement ; les employeurs peuvent publier gratuitement.","Quand le gratuit ne suffit plus, l'employeur sponsorise son annonce avec un budget et paie au résultat, sans forfait ni engagement [s:indeed-tarification].","Le rôle de l'équipe : aider les petites entreprises à bien démarrer, puis à en tirer le meilleur parti."]},{question:"Pourquoi voulez-vous quitter votre poste actuel ?",version_sbs:"Que cherchez-vous chez nous que vous n'avez pas aujourd'hui ?",ce_qu_ils_evaluent:"Ta maturité : est-ce que tu fuis quelque chose, ou est-ce que tu vas vers quelque chose ?",structure:["Ce que tu as appris dans ton poste actuel.","Ce que tu cherches, sans critiquer ton employeur.","Le lien avec ce poste."],piege:"Critiquer son manager ou son entreprise."},{question:"Qu'est-ce qui vous motive dans la vente ?",version_sbs:"Qu'est-ce qui vous motive quand vous passez votre quarantième appel de la journée ?",ce_qu_ils_evaluent:"Ton endurance et ce qui te fait avancer.",structure:["Sois honnête : le challenge et la rémunération variable sont des motivations légitimes.","Ajoute un moteur plus profond : le moment où le client dit oui, l'effet pour lui.","Un exemple de journée difficile et de ce qui t'a fait tenir."]}],Up=[{question:"Parlez-nous de vos résultats commerciaux.",version_sbs:"Quel était votre objectif l'an dernier, l'avez-vous atteint, et comment ?",ce_qu_ils_evaluent:"Si tu connais tes chiffres et si tu sais expliquer ce qui les a produits.",structure:["L'objectif, le résultat, le pourcentage atteint.","Les deux ou trois actions qui l'expliquent.","Si une période a été mauvaise, dis-le et explique ce que tu as changé."],piege:"Hésiter sur ses propres chiffres. Écris-les et apprends-les."},{question:"Racontez-nous votre plus belle vente.",version_sbs:"Racontez-nous une vente à un petit client qui n'était pas convaincu au départ.",ce_qu_ils_evaluent:"Ta méthode, ta ténacité, ta compréhension du besoin.",structure:["**Situation** : le client et son problème.","**Tâche** : ce que tu devais obtenir.","**Action** : ce que tu as fait, étape par étape. C'est la partie la plus longue.","**Résultat** : chiffré, et ce qu'il est devenu ensuite."]},{question:"Parlez-nous d'un échec.",version_sbs:"Parlez-nous d'une vente perdue et de ce que vous en avez retenu.",ce_qu_ils_evaluent:"Ta lucidité et ta capacité à apprendre.",structure:["Un vrai échec, pas un faux défaut.","Ce qui s'est passé, sans accuser personne.","Ce que tu fais différemment depuis."],piege:"« Je n'ai pas vraiment d'échec. »"},{question:"Comment organisez-vous votre travail ?",version_sbs:"Vous avez des centaines de petits clients possibles. Comment choisissez-vous qui appeler aujourd'hui ?",ce_qu_ils_evaluent:"Ton organisation et ton sens des priorités.",structure:["D'abord les rappels promis et les clients en cours.","Ensuite la prospection, ciblée sur ceux qui recrutent maintenant (saison, métiers difficiles).","Tes outils : CRM, rappels, blocs de temps dans l'agenda."],exemple:"« Le matin, je traite d'abord les rappels promis, parce qu'une promesse non tenue coûte un client. Ensuite je prospecte par secteur : par exemple les restaurants d'une zone avant l'été. »"}],Bp=[{question:"Vendez-moi ce stylo.",version_sbs:"Vendez-moi une annonce sponsorisée. Je suis gérant d'un restaurant et je cherche un cuisinier.",ce_qu_ils_evaluent:"Si tu poses des questions avant de vendre.",structure:["Ne présente pas le produit tout de suite. Pose deux ou trois questions : depuis quand, combien de candidatures, pour quand.","Reformule son problème avec ses mots.","Propose une seule solution, reliée à ce problème.","Termine par une étape concrète : « On lance aujourd'hui et je vous rappelle vendredi. »"],piege:"Réciter les fonctionnalités pendant deux minutes."},{question:"Comment menez-vous une découverte ?",version_sbs:"Quelles questions posez-vous à un patron pressé dans les deux premières minutes ?",ce_qu_ils_evaluent:"Ta méthode, adaptée à un interlocuteur qui a peu de temps.",structure:["Le temps : pour quand, depuis quand.","Le coût : ce que le poste vide lui coûte.","La qualité : ce qu'est un bon candidat pour lui.","Le volume : combien de postes, où."]},{question:"Comment traitez-vous une objection ?",version_sbs:"Le client vous dit : « Je publie déjà gratuitement, pourquoi paierais-je ? »",ce_qu_ils_evaluent:"Ton calme et ta compréhension de ce que le payant apporte.",structure:["Accueillir : « Vous avez raison de publier en gratuit. »","Creuser : « Combien de candidatures intéressantes sur votre dernière offre ? »","Répondre : plus de visibilité, paiement au résultat, arrêt possible à tout moment [s:indeed-sponsorisees].","Relancer : un essai court sur le poste le plus urgent."]},{question:"Comment conclure une vente ?",version_sbs:"Le client est intéressé mais dit qu'il va réfléchir. Que faites-vous ?",ce_qu_ils_evaluent:"Ta capacité à obtenir une décision sans forcer.",structure:["Comprendre ce qui bloque : le budget, le moment, autre chose ?","Réduire le risque : petit budget, durée courte, sans engagement.","Si la décision n'est pas prise, fixer une date précise de rappel."]},{question:"Comment développez-vous un client existant ?",version_sbs:"Un client a recruté son serveur grâce à vous. Que faites-vous ensuite ?",ce_qu_ils_evaluent:"Ta vision du client sur la durée.",structure:["Rappeler pour fêter le résultat et demander un retour.","Anticiper le prochain besoin : saison, départ, ouverture.","Demander une recommandation."]},{question:"Comment gérez-vous les refus ?",version_sbs:"Sur 40 appels, 35 vous disent non. Comment le vivez-vous ?",ce_qu_ils_evaluent:"Ta résilience. C'est souvent la vraie question derrière toutes les autres.",structure:["Le refus fait partie du métier : tu raisonnes sur l'ensemble des appels, pas sur un seul.","Tu cherches où ça coince (accroche, découverte, prix) et tu ajustes.","Ce qui te ressource : une pause, un collègue, une victoire à fêter."]}],Vp=[{question:"Parlez-nous d'un client difficile.",version_sbs:"Un client mécontent appelle : il a dépensé son budget et n'a recruté personne. Que faites-vous ?",ce_qu_ils_evaluent:"Ton sens du service.",structure:["Écouter sans te défendre.","Regarder les faits avec lui : candidatures reçues, annonce, salaire affiché, délai de réponse.","Proposer un plan concret et un rappel daté."]},{question:"Parlez-nous d'un moment où vous avez dû apprendre vite.",version_sbs:"Nos produits changent vite. Racontez une fois où vous avez dû maîtriser rapidement un nouveau produit.",ce_qu_ils_evaluent:"Ta capacité d'adaptation.",structure:["Le contexte et le délai.","Ta façon d'apprendre : documentation, collègues, pratique.","Le résultat."]},{question:"Que feriez-vous dans vos 90 premiers jours ?",version_sbs:"Vous arrivez dans l'équipe. Que faites-vous pendant vos trois premiers mois ?",ce_qu_ils_evaluent:"Ton organisation et ton humilité. Question souvent citée dans les avis publics sur les entretiens Indeed [s:glassdoor-ae].",structure:["Premier mois : apprendre les produits et les outils, écouter les meilleurs commerciaux, faire ses premiers appels accompagnée.","Deuxième mois : prendre le rythme, premières ventes, regarder ce qui marche.","Troisième mois : atteindre l'objectif."]},{question:"Pourquoi devrions-nous vous recruter ?",version_sbs:"Pourquoi vous plutôt qu'un autre candidat ?",ce_qu_ils_evaluent:"Ta capacité à conclure, comme dans une vente.",structure:["Trois arguments, pas plus : un résultat chiffré, une compétence clé (écoute, rythme, suivi), un trait de personnalité.","Relie chacun à un besoin du poste.","Termine par : « Y a-t-il un point sur lequel vous avez encore un doute ? »"]}],Qp={id:"entretien",numero:"4",titre:"Préparer l'entretien",accroche:"Le déroulé probable, ton pitch, les questions classiques adaptées au poste, deux jeux de rôle, les objections courantes et les questions à poser à la fin.",sections:[{id:"entretien-deroule",titre:"Le déroulé probable",blocs:[{type:"p",texte:"**L'idée clé : attends-toi à trois à cinq rendez-vous, dont probablement une mise en situation.** C'est ce que décrivent les avis publics de candidats à des postes commerciaux chez Indeed [s:glassdoor-ae]."},{type:"tableau",colonnes:["Étape","Ce qu'on y teste","Comment t'y préparer"],lignes:[["Échange avec le recruteur","Motivation, parcours, disponibilité","Ton pitch et ta réponse à « Pourquoi Indeed ? »"],["Entretien avec le manager","Résultats, méthode, état d'esprit","Tes chiffres et deux histoires de vente"],["Mise en situation","Un appel client joué","Les jeux de rôle et les objections de cette page"],["Entretien final","Adéquation avec l'équipe et les valeurs","Les valeurs d'Indeed et tes questions de fin"]]},{type:"encadre",ton:"conseil",titre:"Écris au recruteur avant l'entretien",items:["Demande combien d'étapes il y a et qui tu vas rencontrer.","Demande s'il y a un jeu de rôle, et sur quel type de client.","Demande si une partie se fait en anglais : l'équipe travaille avec plusieurs pays européens [s:sbs-activation-it].","C'est bien vu : tu prépares ton entretien comme un appel client."]}]},{id:"entretien-pitch",titre:"Ton pitch de deux minutes",blocs:[{type:"p",texte:"**L'idée clé : quatre temps, deux minutes, et des chiffres.**"},{type:"liste",ordonnee:!0,items:["**Qui tu es** (15 secondes) : ton poste, ce que tu vends, à qui.","**Ce que tu as prouvé** (45 secondes) : deux résultats chiffrés.","**Ce qui te ressemble** (30 secondes) : ce que tu aimes dans la vente, avec un exemple.","**Pourquoi ce poste** (30 secondes) : la mission, les petites entreprises, le rythme."]},{type:"encadre",ton:"conseil",titre:"Entraîne-toi à voix haute",items:["Chronomètre-toi. Au-delà de 2 min 30, coupe.","Enregistre-toi une fois et réécoute.","Prépare aussi une version de 30 secondes."]}]},{id:"entretien-q-motivation",titre:"Questions : motivation et Indeed",blocs:[{type:"questions",items:$p}]},{id:"entretien-q-parcours",titre:"Questions : parcours et résultats",blocs:[{type:"questions",items:Up}]},{id:"entretien-q-methode",titre:"Questions : méthode de vente",blocs:[{type:"questions",items:Bp}]},{id:"entretien-q-situations",titre:"Questions : mises en situation",blocs:[{type:"questions",items:Vp}]},{id:"entretien-roleplay",titre:"Jeux de rôle",blocs:[{type:"p",texte:"**L'idée clé : suis les étapes de la conversation de vente, de l'accroche au rappel daté.** Avant chaque réplique, essaie de deviner la tienne à voix haute."},{type:"roleplay",titre:"Jeu de rôle 1 : appel à un restaurant qui publie en gratuit",contexte:["Tu appelles Marc, gérant d'une brasserie à Lyon. Il publie depuis trois semaines une offre gratuite de cuisinier sur Indeed.","Il est 15 h 10, juste après le service. Objectif : qu'il accepte de sponsoriser l'offre, ou au minimum un rappel daté."],repliques:[{qui:"toi",texte:"Bonjour Marc, [prénom] d'Indeed. Je vois que vous cherchez un cuisinier depuis trois semaines. J'appelle après le service exprès : vous avez deux minutes ?",note:"Ouvrir : accroche sur son poste, respect de son emploi du temps."},{qui:"client",texte:"Deux minutes. Mais je ne paie pas pour de la pub."},{qui:"toi",texte:"Entendu, je ne vais rien vous proposer sans comprendre d'abord. Combien de candidatures avez-vous reçues, et combien vous ont intéressé ?",note:"Accueillir l'objection, puis découvrir."},{qui:"client",texte:"Une dizaine. Deux sont venus en entretien, aucun n'était au niveau."},{qui:"toi",texte:"Et si le poste n'est pas pourvu d'ici la fin du mois, qu'est-ce que ça change pour vous ?",note:"Faire chiffrer le coût par le client."},{qui:"client",texte:"Je suis en cuisine à sa place, et je vais devoir fermer le lundi."},{qui:"toi",texte:"Donc chaque semaine sans cuisinier vous coûte un jour d'ouverture. Je vous propose de garder votre annonce et de la sponsoriser pour qu'elle passe devant les offres similaires, avec un budget que vous fixez. Vous payez au résultat et vous arrêtez quand vous voulez.",note:"Reformuler, puis recommander une seule solution [s:indeed-sponsorisees]."},{qui:"client",texte:"Ça coûte combien ?"},{qui:"toi",texte:"Ça dépend du poste et de la concurrence à Lyon : Indeed calcule un budget recommandé. Avant ça, deux changements gratuits sur l'annonce : afficher le salaire et les horaires. Les bons candidats regardent ça en premier.",note:"Ne pas inventer de prix. Conseiller sur l'annonce avant de parler budget."},{qui:"client",texte:"D'accord pour le salaire. Pour le budget, je veux voir avant."},{qui:"toi",texte:"C'est normal. On le règle ensemble pour deux semaines, je vous rappelle jeudi prochain à 15 h pour regarder les candidatures, et vous décidez de continuer ou d'arrêter. Ça vous va ?",note:"Conclure : risque réduit et rappel précis."},{qui:"client",texte:"Jeudi 15 h, ça marche."}],debrief:["Tu as parlé de son problème avant de parler d'Indeed.","Le client a chiffré lui-même ce que lui coûte le poste vide.","Tu n'as pas inventé de prix.","Tu as donné un conseil gratuit sur l'annonce, ce qui crée la confiance.","Tu as conclu sur une prochaine étape datée."]},{type:"roleplay",titre:"Jeu de rôle 2 : une cliente qui reçoit trop de candidatures",contexte:["Tu as rendez-vous en visio avec Sophie, cogérante d'une entreprise de services à domicile. Elle cherche trois aides à domicile.","Elle a déjà sponsorisé une offre et elle est déçue : beaucoup de candidatures, peu de candidats avec le permis et une voiture."],repliques:[{qui:"toi",texte:"Merci pour ce rendez-vous, Sophie. Pour vous être utile, commençons par votre dernière campagne : que s'est-il passé ?",note:"Partir de son expérience, même négative."},{qui:"client",texte:"Soixante candidatures. J'ai passé mes soirées à trier, et la plupart n'avaient pas de voiture."},{qui:"toi",texte:"C'est beaucoup de temps perdu. Pour vous, quels sont les critères non négociables ?",note:"Découvrir : la qualité."},{qui:"client",texte:"Le permis, une voiture, et être disponible un week-end sur deux."},{qui:"toi",texte:"Est-ce que ces trois critères apparaissent en haut de votre annonce ?"},{qui:"client",texte:"Non, ils sont à la fin."},{qui:"toi",texte:"Je vois deux leviers. D'abord, remonter ces critères en haut de l'annonce, pour que les candidats se sélectionnent eux-mêmes. Ensuite, ajouter des questions de présélection pour filtrer avant que la candidature n'arrive chez vous.",note:"Recommander à partir du problème (le tri), pas du volume."},{qui:"client",texte:"Et pour trouver des gens qui n'ont pas postulé ?"},{qui:"toi",texte:"Indeed permet aussi de rechercher des candidats et de les inviter à postuler [s:futureworks-2025]. Combien de temps vous donnez-vous pour ces trois recrutements ?",note:"Rester simple sur le produit, et revenir à son délai."},{qui:"client",texte:"Un mois maximum."},{qui:"toi",texte:"Alors je vous propose : on réécrit l'annonce maintenant, on relance la sponsorisation sur les trois postes, et je vous rappelle dans une semaine pour regarder la qualité des profils, pas seulement leur nombre.",note:"Conclure avec un critère de réussite qui lui parle."},{qui:"client",texte:"Si je passe moins de temps à trier, c'est déjà gagné."}],debrief:["Tu as écouté son expérience négative sans te défendre.","Tu as transformé « trop de candidatures » en problème de critères.","Tu as proposé un conseil gratuit avant le produit payant.","Tu as défini la réussite avec ses mots : moins de tri, de meilleurs profils."]}]},{id:"entretien-objections",titre:"Les objections courantes",blocs:[{type:"p",texte:"**L'idée clé : accueillir, creuser et répondre, puis relancer.** La même méthode marche pour chaque objection."},{type:"objections",items:[{objection:"Je publie déjà gratuitement, ça me suffit.",reformuler:"« Vous avez raison de publier en gratuit. Est-ce que ça suffit pour ce poste-là ? »",repondre:["Demande combien de candidatures intéressantes il a reçues.","L'annonce sponsorisée se démarque des offres similaires [s:indeed-sponsorisees].","Pour un poste urgent ou difficile, le gratuit est souvent trop lent."],relance:"« Gardons le gratuit pour vos postes faciles, et testons la sponsorisation sur le plus urgent. »"},{objection:"C'est trop cher.",reformuler:"« Je comprends, chaque euro compte. Trop cher par rapport à quoi ? »",repondre:["Compare au coût du poste vide : heures sup, clients refusés, jour de fermeture.","Pas de forfait ni d'engagement : on paie au résultat [s:indeed-tarification].","Le budget se règle et se suspend à tout moment [s:indeed-sponsorisees]."],relance:"« Fixons un budget que vous êtes à l'aise de tester deux semaines, et on regarde les résultats ensemble. »"},{objection:"Je recrute par le bouche-à-oreille.",reformuler:"« C'est souvent un très bon moyen, les candidats sont recommandés. »",repondre:["Demande combien de temps ça prend, et ce qui se passe quand personne ne connaît personne.","Près d'un recrutement sur deux est jugé difficile [s:bmo-metiers] : le réseau ne suffit pas toujours."],relance:"« La prochaine fois que le bouche-à-oreille ne donne rien en une semaine, on en reparle ? Je vous rappelle avant votre saison. »"},{objection:"J'ai déjà essayé Indeed, ça n'a pas marché.",reformuler:"« Merci de me le dire. Qu'est-ce qui n'a pas marché exactement ? »",repondre:["Trois causes possibles : pas assez de candidatures, de mauvaises candidatures, ou des candidats qui ne répondent plus.","Propose de regarder l'ancienne annonce ensemble : titre, salaire, horaires, lieu."],relance:"« Si on corrige ensemble ce qui a bloqué, seriez-vous d'accord pour un essai court ? »"},{objection:"Je passe par France Travail, c'est gratuit.",reformuler:"« C'est un bon réflexe, c'est le premier site emploi en audience [s:rhmatin-classement]. »",repondre:["Ne le critique pas : présente Indeed comme un complément.","Tous les candidats ne passent pas par France Travail, en particulier ceux qui ont déjà un emploi."],relance:"« Gardez France Travail, et ajoutons Indeed sur ce poste pour toucher les autres candidats. »"},{objection:"Je n'ai pas le temps. Envoyez-moi un mail.",reformuler:"« Bien sûr, je vous appelle sûrement en plein travail. »",repondre:["Pose une seule question pour que le mail soit utile : « Vous avez un poste à pourvoir en ce moment ? »","Fixe tout de suite un créneau précis plutôt que « plus tard »."],relance:"« Je vous envoie le mail dans l'heure. Demain 15 h ou jeudi 10 h pour en parler cinq minutes ? »"}]}]},{id:"entretien-a-poser",titre:"Les questions à poser à la fin",blocs:[{type:"p",texte:"**L'idée clé : une bonne question montre que tu te vois déjà dans le poste.** Prépare-en cinq, pose-en deux ou trois."},{type:"liste",items:["« À quoi ressemble une très bonne première année dans l'équipe ? »","« Qu'est-ce qui distingue vos meilleurs commerciaux ? »","« Comment se passent la formation et les premières semaines ? »","« Quelle est la part de prospection et la part de suivi de clients ? »","« Comment l'IA change-t-elle le travail des commerciaux chez vous ? »","« Y a-t-il un point de mon parcours sur lequel vous avez encore un doute ? » (pour la toute fin)"]},{type:"encadre",ton:"attention",titre:"Les erreurs à éviter",items:["Ne pas avoir de question.","Commencer par les congés ou le télétravail : ces sujets se voient plus tard, avec le recruteur.","Donner un chiffre dont tu ne connais pas l'origine.","Arriver sans fourchette de salaire préparée."]}]}]},Hp={id:"indeed",numero:"2",titre:"Comment marche Indeed",accroche:"Les bases d'Indeed expliquées simplement : qui sont ses utilisateurs, comment un employeur s'en sert, comment Indeed gagne de l'argent et ce qui fait une bonne annonce.",sections:[{id:"indeed-10-minutes",titre:"Indeed en 10 minutes",blocs:[{type:"p",texte:"**L'idée clé : Indeed met en relation des personnes qui cherchent un emploi et des employeurs qui recrutent.** Les candidats l'utilisent gratuitement. Les employeurs peuvent publier gratuitement, et paient s'ils veulent plus de visibilité."},{type:"chiffres",items:[{valeur:"31",libelle:"personnes embauchées par minute en moyenne via Indeed et Glassdoor en 2025, dans le monde",source:"recruit-fy2025"},{valeur:"3,5 M",libelle:"employeurs qui utilisent Indeed chaque année, dans le monde",source:"recruit-fy2025"},{valeur:"7,9 M",libelle:"visiteurs uniques en France en mai 2026",source:"mediametrie-indeed-2026"}]},{type:"p",texte:"Indeed est né en **2004** aux États-Unis comme moteur de recherche d'emploi. Il appartient depuis **2012** au groupe japonais **Recruit Holdings**, qui possède aussi **Glassdoor**, le site d'avis sur les entreprises [s:recruit-rapport-annuel]."},{type:"duo",gauche:{titre:"Côté chercheurs d'emploi (gratuit)",items:["Ils cherchent une offre par métier et par ville.","Ils créent un profil et déposent leur CV.","Ils postulent, souvent en quelques clics depuis leur téléphone.","Ils reçoivent des alertes quand une offre correspond."]},droite:{titre:"Côté employeurs",items:["Ils publient une annonce, gratuite ou sponsorisée.","Ils reçoivent et trient les candidatures.","Ils peuvent aussi chercher eux-mêmes des candidats et les inviter à postuler.","Ils contactent les candidats, organisent les entretiens, puis embauchent."]}},{type:"encadre",ton:"conseil",titre:"Pourquoi les deux côtés comptent",items:["Plus il y a de candidats, plus Indeed est utile aux employeurs, et inversement. C'est ce qu'on appelle un marché à deux faces.","Conséquence pour toi : une annonce claire sert à la fois le candidat et ton client. Le conseil sur l'annonce fait partie de la vente."]}]},{id:"indeed-parcours",titre:"Le parcours d'un employeur",blocs:[{type:"p",texte:"**L'idée clé : à chaque étape, l'employeur peut bloquer, et c'est là que tu peux l'aider.** Voici le chemin type d'une petite entreprise sur Indeed."},{type:"liste",ordonnee:!0,items:["**Il crée son compte** et publie sa première annonce.","**Il attend des candidatures.** Une annonce gratuite peut suffire pour un poste facile.","**S'il n'en reçoit pas assez**, il peut sponsoriser l'annonce avec un budget.","**Il trie les candidatures**, idéalement avec quelques questions de présélection.","**Il répond aux candidats** et organise les entretiens. Un employeur qui répond vite garde les bons candidats.","**Il embauche**, puis revient au prochain besoin : nouvelle saison, départ, croissance."]},{type:"tableau",colonnes:["Où ça coince","Ce que tu peux faire"],lignes:[["Pas assez de candidatures","Améliorer l'annonce, puis la sponsoriser."],["Trop de candidatures inadaptées","Clarifier les critères indispensables et ajouter des questions de présélection."],["De bons candidats qui ne répondent plus","Conseiller de répondre vite et de proposer un entretien rapidement."]]}]},{id:"indeed-modele",titre:"Gratuit ou sponsorisé : comment Indeed gagne de l'argent",blocs:[{type:"p",texte:"**L'idée clé : l'employeur ne paie pas pour être présent, il paie pour un résultat.** C'est le principe du paiement à la performance."},{type:"liste",items:["**Gratuit** : un employeur peut publier jusqu'à **trois offres gratuites par mois** directement sur Indeed, sous conditions [s:indeed-tarification].","**Sponsorisé** : l'annonce est mise en avant dans les résultats de recherche pour se démarquer des offres similaires [s:indeed-sponsorisees].","**Paiement au résultat** : pas de forfait. L'employeur fixe un budget et paie quand un candidat clique sur l'offre ou commence à postuler, selon les cas [s:indeed-tarification] [s:indeed-ppsa].","**Budget recommandé** : Indeed propose un montant selon le poste, le lieu et la description. Il existe un niveau Standard et un niveau Premium, plus élevé, pour recevoir plus vite plus de candidatures pertinentes [s:indeed-tarifs].","**Sans engagement** : on peut suspendre ou arrêter la sponsorisation à tout moment [s:indeed-sponsorisees]."]},{type:"chiffres",items:[{valeur:"3",libelle:"offres gratuites par mois au maximum, sous conditions",source:"indeed-tarification"},{valeur:"× 2,4",libelle:"candidatures reçues par une annonce sponsorisée Premium par rapport à une offre non sponsorisée, selon Indeed France",source:"indeed-sponsorisees"}]},{type:"encadre",ton:"conseil",titre:"L'expliquer à un patron en trois phrases",items:["« Vous pouvez publier gratuitement. Quand vous voulez plus de candidats, vous fixez un budget. »","« Vous payez seulement quand un candidat s'intéresse à votre offre, et vous arrêtez quand vous voulez. »","« Pour un poste facile, le gratuit peut suffire. Pour un poste urgent ou difficile, la sponsorisation vous fait gagner du temps. »"]}]},{id:"indeed-annonce",titre:"Ce qui fait une bonne annonce",blocs:[{type:"p",texte:"**L'idée clé : une annonce claire attire les bons candidats, quel que soit le budget.** C'est le conseil le plus simple et le plus utile que tu peux donner à un client."},{type:"liste",items:["**Un titre simple**, avec le mot que les candidats tapent : « Cuisinier » plutôt que « Ninja des fourneaux ».","**Le salaire**, même sous forme de fourchette. C'est l'une des premières choses que regarde un candidat.","**Le lieu, les horaires et le type de contrat** : CDI, CDD, temps partiel, week-ends.","**Les critères indispensables en haut** (permis, diplôme, disponibilité) : les candidats se sélectionnent eux-mêmes.","**Une description courte** : les missions, l'équipe, ce que l'entreprise offre.","**Une réponse rapide aux candidats** : une bonne annonce ne sert à rien si personne ne rappelle."]},{type:"encadre",ton:"conseil",titre:"Pourquoi c'est un argument de vente",items:["Proposer d'améliorer l'annonce avant de parler budget crée la confiance : tu n'es pas là pour vendre de l'espace, mais pour aider à recruter.","Une meilleure annonce rend aussi la sponsorisation plus efficace."]}]},{id:"indeed-valeurs",titre:"Mission et valeurs",blocs:[{type:"p",texte:"**L'idée clé : la mission d'Indeed tient en une phrase, « We help people get jobs », nous aidons les gens à trouver un emploi** [s:indeed-carrieres]. Cinq valeurs l'accompagnent [s:indeed-valeurs] [s:indeed-valeurs-liste]."},{type:"tableau",colonnes:["Valeur","En clair, pour ton futur poste"],lignes:[["**Job Seeker First** (le chercheur d'emploi d'abord)","Une annonce claire pour le candidat est aussi une meilleure annonce pour ton client."],["**Pay for Performance** (payer pour un résultat)","Le client paie pour des candidats intéressés, pas pour une simple présence."],["**Data-Driven** (piloté par les données)","On mesure pour s'améliorer : parle de tes résultats en chiffres."],["**Innovation**","Les produits changent vite, notamment avec l'IA : montre que tu apprends vite."],["**Inclusion & Belonging** (inclusion et appartenance)","Ouvrir un poste à des profils variés est aussi un bon conseil pour un client qui peine à recruter."]]},{type:"encadre",ton:"conseil",titre:"La question « Pourquoi Indeed ? »",items:["Évite « c'est le numéro 1 » : tout le monde le dit.","Réponds en trois temps : la mission (aider les gens à trouver un emploi), les clients (des petites entreprises pour qui un recrutement compte beaucoup), toi (ce que tu as prouvé en vente et que tu veux mettre au service de ça)."]}]},{id:"indeed-concurrence",titre:"Les autres solutions du client",blocs:[{type:"p",texte:"**L'idée clé : ton client utilise déjà autre chose, et ce n'est pas un problème.** Tu ne remplaces pas ses habitudes, tu complètes ce qui ne suffit plus."},{type:"liste",items:["**Le bouche-à-oreille** : le premier réflexe d'une petite entreprise, gratuit et rassurant.","**France Travail** : le service public, gratuit, premier site emploi en audience en France [s:rhmatin-classement].","**Les autres sites d'emploi** (généralistes, régionaux ou spécialisés) et les petites annonces locales.","**LinkedIn** : plutôt pour les cadres et les métiers de bureau.","**Indeed gratuit** : souvent le vrai concurrent d'Indeed sponsorisé."]},{type:"encadre",ton:"conseil",titre:"Règle d'or",items:["Ne critique jamais un concurrent, ni devant un client, ni devant un jury.","Demande plutôt quels résultats il obtient : le client fait la comparaison lui-même."]}]},{id:"indeed-lexique",titre:"Mini-lexique",blocs:[{type:"p",texte:"**L'idée clé : avec une quinzaine de mots, tu peux suivre toute la conversation d'un entretien.**"},{type:"tableau",colonnes:["Mot","En clair"],lignes:[["**Chercheur d'emploi**","La personne qui cherche un poste. Indeed est gratuit pour elle."],["**Employeur**","L'entreprise qui recrute. C'est ton client."],["**Annonce** (ou offre d'emploi)","Le poste publié sur Indeed."],["**Annonce gratuite**","Publiée sans payer. Visible, mais sans mise en avant."],["**Annonce sponsorisée**","Mise en avant contre un budget, pour se démarquer des offres similaires."],["**Candidature**","Un candidat qui postule à l'annonce."],["**Budget**","Le montant que l'employeur accepte de dépenser pour sponsoriser une annonce."],["**Budget recommandé**","Le montant proposé par Indeed selon le poste, le lieu et la concurrence."],["**Paiement au clic** (CPC, coût par clic)","L'employeur paie quand un candidat clique sur l'offre."],["**Paiement par candidature commencée** (PPSA en anglais)","L'employeur paie quand un candidat commence à postuler."],["**Standard / Premium**","Deux niveaux de sponsorisation. Premium coûte plus cher et vise plus de candidatures pertinentes, plus vite."],["**Présélection**","Quelques questions posées au candidat pour filtrer les candidatures."],["**ATS**","Logiciel de suivi des candidatures, utilisé surtout par les grandes entreprises."],["**TPE / PME**","Très petite entreprise (moins de 10 salariés) / petite et moyenne entreprise."],["**CRM**","L'outil où le commercial suit ses clients, ses appels et ses relances."]]}]}]},Wp={id:"marche",numero:"1",titre:"Le recrutement aujourd'hui",accroche:"Avant de vendre Indeed, il faut comprendre le problème de tes clients : recruter la bonne personne, vite, sans service RH et sans y passer ses soirées.",sections:[{id:"marche-photo",titre:"Le marché de l'emploi en trois chiffres",blocs:[{type:"p",texte:"**L'idée clé : il y a plus de candidats qu'avant, mais recruter reste difficile.** Le problème du client n'est pas d'avoir des candidatures, c'est d'avoir les bonnes."},{type:"chiffres",items:[{valeur:"8,3 %",libelle:"taux de chômage en France au 2e trimestre 2026, plus haut niveau depuis 2020",source:"insee-chomage"},{valeur:"43,8 %",libelle:"des projets de recrutement 2026 jugés difficiles par les employeurs",source:"bmo-metiers"},{valeur:"÷ 2",libelle:"volume d'offres d'emploi en ligne depuis le pic de fin 2022",source:"hl-avril-2026"}]},{type:"p",texte:"Ces trois chiffres racontent une seule histoire. Le chômage remonte [s:insee-chomage] et les offres sont moins nombreuses [s:hl-avril-2026] : un employeur trouve donc plus facilement des candidats qu'en 2022. Pourtant, près d'un recrutement sur deux reste jugé difficile [s:bmo-metiers]. Le sujet n'est plus le volume, c'est la **qualité** et la **rapidité**."},{type:"encadre",ton:"conseil",titre:"Comment t'en servir en entretien",items:["Retiens le contraste, pas la liste : « plus de candidats disponibles, mais un recrutement sur deux reste difficile ».","Relie-le tout de suite au patron de petite entreprise : il n'a pas de service RH, et chaque poste vide lui coûte du chiffre d'affaires."]}]},{id:"marche-change",titre:"Ce qui change dans la façon de recruter",blocs:[{type:"p",texte:"**L'idée clé : les candidats ont le choix, donc l'employeur doit être clair, rapide et ouvert.**"},{type:"liste",items:["**Postuler est devenu facile.** On candidate en quelques clics depuis son téléphone. Résultat : l'employeur reçoit parfois beaucoup de candidatures à trier, et un candidat sans réponse part ailleurs.","**On recrute davantage sur les compétences.** Beaucoup d'employeurs qui peinent à recruter acceptent des profils moins expérimentés ou venus d'une autre formation [s:bmo-metiers]. Un bon conseil au client : ouvrir le poste plutôt que chercher le mouton à cinq pattes.","**L'intelligence artificielle arrive dans le recrutement.** Elle aide à rédiger une annonce, à proposer un salaire ou à repérer des candidats. Indeed a lancé ses propres assistants IA en 2025 [s:futureworks-2025].","**Le salaire devient public.** Un projet de loi prévoit d'obliger les employeurs à afficher une fourchette de salaire dans leurs offres [s:loi-transparence]. Au 06/10/2026, il n'est pas encore voté [s:loi-transparence-avocats] : dis « le projet de loi prévoit », pas « la loi impose »."]}]},{id:"marche-tpe",titre:"Ce que vit un patron de petite entreprise quand il recrute",blocs:[{type:"p",texte:"**L'idée clé : ton client recrute rarement, souvent dans l'urgence, et seul.** C'est la section la plus importante de cette partie, parce que c'est ton futur interlocuteur. Elle relève du bon sens commercial : sers-t'en comme grille de questions."},{type:"duo",gauche:{titre:"Sa réalité",items:["Pas de service RH : c'est le gérant qui recrute, entre deux clients.","Il recrute peu souvent, souvent dans l'urgence (départ, saison, nouveau contrat).","Il a déjà essayé le bouche-à-oreille, France Travail ou une annonce gratuite.","Son budget est serré : chaque euro doit se justifier.","Il reçoit soit trop de candidatures inadaptées, soit aucune."]},droite:{titre:"Ce que ça veut dire pour toi",items:["Sois brève et concrète : parle de candidats, de délais et d'euros.","Demande toujours « Pour quand avez-vous besoin de cette personne ? ».","Ne critique rien : demande ce qui a marché, et ce qui n'a pas marché.","Compare le coût de la campagne au coût du poste vide (heures sup, clients refusés, fatigue de l'équipe).","Trop de candidatures et pas assez ne se traitent pas pareil : mieux trier dans un cas, être plus visible dans l'autre."]}}]}]},En=[{theme:"Marché",recto:"Le paradoxe du marché de l'emploi en 2026 ?",verso:"Le chômage remonte (**8,3 %** [s:insee-chomage]), mais **43,8 %** des recrutements restent jugés difficiles [s:bmo-metiers]. Le sujet n'est pas le volume de candidats, c'est d'avoir **les bons, vite**."},{theme:"Marché",recto:"Comment a évolué le nombre d'offres d'emploi en ligne depuis fin 2022 ?",verso:"**Divisé par deux** depuis le pic de fin 2022 [s:hl-avril-2026]."},{theme:"Marché",recto:"Que prévoit le projet de loi sur la transparence des salaires ?",verso:"Une **fourchette de salaire** dans les offres d'emploi [s:loi-transparence]. **Pas encore voté** au 06/10/2026 [s:loi-transparence-avocats]."},{theme:"Marché",recto:"Les trois réalités d'un patron de petite entreprise qui recrute ?",verso:"Il recrute **seul** (pas de service RH), **rarement** et souvent **dans l'urgence**, avec un **budget serré**."},{theme:"Indeed",recto:"La mission d'Indeed ?",verso:"**We help people get jobs** : nous aidons les gens à trouver un emploi [s:indeed-carrieres]."},{theme:"Indeed",recto:"Les cinq valeurs d'Indeed ?",verso:"**Job Seeker First, Pay for Performance, Data-Driven, Innovation, Inclusion & Belonging** [s:indeed-valeurs-liste]."},{theme:"Indeed",recto:"Création d'Indeed et groupe actionnaire ?",verso:"Créé en **2004**, racheté en **2012** par le groupe japonais **Recruit Holdings**, qui possède aussi Glassdoor [s:recruit-rapport-annuel]."},{theme:"Indeed",recto:"Trois chiffres pour situer Indeed ?",verso:"**31** embauches par minute dans le monde et **3,5 millions** d'employeurs par an [s:recruit-fy2025] ; **7,9 millions** de visiteurs uniques en France en mai 2026 [s:mediametrie-indeed-2026]."},{theme:"Indeed",recto:"Que veut dire « marché à deux faces » ?",verso:"Indeed sert **deux publics** : les chercheurs d'emploi (gratuit) et les employeurs. Plus il y a de candidats, plus Indeed est utile aux employeurs, et inversement."},{theme:"Produits",recto:"Gratuit ou sponsorisé : quelle différence ?",verso:"Jusqu'à **trois offres gratuites** par mois, sous conditions [s:indeed-tarification]. L'annonce **sponsorisée** est mise en avant face aux offres similaires, contre un budget [s:indeed-sponsorisees]."},{theme:"Produits",recto:"Comment paie-t-on une annonce sponsorisée ?",verso:"**Au résultat** : quand un candidat clique ou commence à postuler. Pas de forfait, pas d'engagement [s:indeed-tarification]."},{theme:"Produits",recto:"Standard ou Premium ?",verso:"Deux niveaux de budget. **Premium** coûte plus cher et vise plus de candidatures pertinentes, plus vite [s:indeed-tarifs] : **2,4 fois** plus de candidatures qu'une offre non sponsorisée, selon Indeed France [s:indeed-sponsorisees]."},{theme:"Produits",recto:"Les cinq ingrédients d'une bonne annonce ?",verso:"Un **titre simple**, le **salaire**, le **lieu et les horaires**, les **critères indispensables en haut**, une **description courte**. Et une réponse rapide aux candidats."},{theme:"SBS",recto:"Que veut dire SBS, et quels sont ses deux métiers ?",verso:"**Scaled Business Success**, l'équipe des petites entreprises. **Activation** : prospects, nouveaux et anciens clients [s:sbs-activation-it]. **Développement** : clients qui dépensent déjà [s:sbs-development]."},{theme:"SBS",recto:"Comment travaille l'équipe SBS ?",verso:"**À distance**, par téléphone et par e-mail, avec beaucoup d'appels sortants et des résultats suivis chaque trimestre [s:sbs-activation-2026]."},{theme:"Vente",recto:"Les étapes de la conversation de vente ?",verso:"**Ouvrir, découvrir, reformuler, recommander, répondre aux objections, conclure, suivre.**"},{theme:"Vente",recto:"Les quatre thèmes de la découverte ?",verso:"Le **temps** (pour quand), le **coût** (ce que coûte le poste vide), la **qualité** (c'est quoi un bon candidat), le **volume** (combien, où)."},{theme:"Vente",recto:"La question pour définir la réussite avec le client ?",verso:"« **Dans un mois, qu'est-ce qui vous ferait dire que ça a marché ?** »"},{theme:"Vente",recto:"Les trois temps du traitement d'une objection ?",verso:"**Accueillir et reformuler**, **creuser puis répondre**, **relancer** vers une prochaine étape."},{theme:"Vente",recto:"Les quatre temps d'une réponse STAR ?",verso:"**Situation, Tâche, Action, Résultat.** L'action est la partie la plus longue, le résultat doit être chiffré."}],Jp={id:"revision",numero:"5",titre:"Réviser",accroche:"Les cartes de révision, la fiche résumé, la checklist de la veille et toutes les sources.",sections:[{id:"revision-cartes",titre:"Cartes de révision",blocs:[{type:"p",texte:"**L'idée clé : réponds à voix haute avant de retourner la carte.** Filtre par thème pour réviser une partie précise."},{type:"flashcards"}]},{id:"revision-fiche",titre:"Fiche résumé",blocs:[{type:"p",texte:"**L'idée clé : six chiffres et six idées suffisent pour tout l'entretien.**"},{type:"duo",gauche:{titre:"Les 6 chiffres à savoir",items:["**8,3 %** de chômage au 2e trimestre 2026 [s:insee-chomage]","**43,8 %** des recrutements jugés difficiles [s:bmo-metiers]","Offres d'emploi **divisées par deux** depuis fin 2022 [s:hl-avril-2026]","**31** embauches par minute via Indeed et Glassdoor en 2025 [s:recruit-fy2025]","**3** offres gratuites par mois, puis paiement au résultat [s:indeed-tarification]","**2,4 fois** plus de candidatures avec une annonce sponsorisée Premium [s:indeed-sponsorisees]"]},droite:{titre:"Les 6 idées à faire passer",items:["Le client ne veut pas des candidatures, il veut **les bons candidats, vite**.","Le vrai concurrent d'Indeed sponsorisé, c'est souvent **Indeed gratuit**.","Je **comprends avant de proposer**.","Je compare au **coût du poste vide**, pas au prix de l'annonce.","Une **bonne annonce** compte autant que le budget.","Avec un petit client, la valeur vient du **suivi**."]}}]},{id:"revision-checklist",titre:"Checklist de la veille",blocs:[{type:"p",texte:"**L'idée clé : coche ce qui est prêt, révise le reste.** Les cases cochées restent enregistrées dans ton navigateur."},{type:"checklist",id:"veille",groupes:[{titre:"Le fond",items:["Je connais mes chiffres : objectif, atteinte, nombre de clients.","J'ai deux histoires de vente au format STAR, une gagnée et une perdue.","Je sais dire mon pitch en 2 minutes et en 30 secondes.","Je sais expliquer simplement comment Indeed gagne de l'argent avec une petite entreprise.","Je connais les étapes de la conversation de vente et les quatre thèmes de la découverte.","J'ai joué les deux jeux de rôle à voix haute, idéalement avec quelqu'un.","J'ai une réponse pour chacune des six objections.","J'ai cinq questions prêtes pour la fin.","J'ai une fourchette de salaire préparée."]},{titre:"Les personnes",items:["J'ai regardé le profil LinkedIn des personnes que je vais rencontrer.","J'ai lu les dernières publications d'Indeed France sur LinkedIn.","J'ai écrit au recruteur pour connaître les étapes, le jeu de rôle éventuel et la langue de l'entretien."]},{titre:"La logistique",items:["Je connais l'heure, le lien de visio ou l'adresse, et le nom de mon interlocuteur.","J'ai testé micro, caméra et connexion, ou prévu mon trajet avec 20 minutes de marge.","J'ai mon CV, une feuille avec mes chiffres et de quoi prendre des notes.","J'ai prévu un mail de remerciement à envoyer le jour même."]}]}]},{id:"revision-sources",titre:"Sources",blocs:[{type:"p",texte:"Chaque numéro dans le site renvoie à cette liste. Toutes ces sources sont publiques."},{type:"sources"}]}]},Kp={id:"sbs",numero:"3",titre:"Le métier SBS et la méthode de vente",accroche:"Ce que fait l'équipe, qui sont ses clients, et la méthode de vente qui marche avec une petite entreprise : ouvrir, découvrir, recommander, conclure, suivre.",sections:[{id:"sbs-role",titre:"Le rôle de l'équipe",blocs:[{type:"p",texte:"**L'idée clé : l'équipe SBS aide les petites entreprises à recruter avec Indeed, entièrement à distance.** SBS veut dire **Scaled Business Success**. Tout se fait par téléphone et par e-mail, avec beaucoup d'appels sortants [s:sbs-activation-2026]."},{type:"duo",gauche:{titre:"Activation",items:["**Les clients** : des prospects, des nouveaux clients et d'anciens clients à faire revenir [s:sbs-activation-it].","**La mission** : comprendre leur besoin, leur montrer ce qu'Indeed peut faire, et les aider à lancer leurs annonces [s:sbs-activation-it].","**En entretien**, attends-toi à parler de prospection, de première vente et de relance d'un client perdu."]},droite:{titre:"Développement",items:["**Les clients** : des entreprises qui dépensent déjà sur Indeed [s:sbs-development].","**La mission** : proposer les bonnes solutions, montrer le retour sur investissement et fidéliser [s:sbs-development].","**En entretien**, attends-toi à parler de suivi, de fidélisation et de développement d'un client existant."]}},{type:"encadre",ton:"conseil",titre:"Les quatre blocs à maîtriser",items:["**Le marché du recrutement et Indeed** : le problème du client et comment Indeed y répond (parties 1 et 2).","**Les produits** : gratuit, sponsorisé, budget, présélection. Tu n'as pas besoin de tout connaître avant d'arriver.","**Les outils** : le CRM et les outils internes, qu'on apprend une fois en poste.","**La méthode de vente et de suivi** : c'est ce que le jury évaluera le plus. Elle est détaillée ci-dessous."]}]},{id:"sbs-clients",titre:"Qui sont les clients",blocs:[{type:"p",texte:"**L'idée clé : ton client est un gérant pressé, qui n'est pas expert en recrutement et qui décide seul.** Restaurants, artisans, commerces, garages, services à domicile, petites entreprises de services."},{type:"liste",items:["**Il décide seul**, souvent pendant l'appel.","**Il est pressé** : tu l'appelles en plein service ou sur un chantier. Va à l'essentiel en 30 secondes.","**Il n'est pas expert** : évite le jargon. Parle de candidats, de délais et d'euros.","**Il fait attention au prix** et se méfie du démarchage : ta crédibilité vient de ta connaissance de son métier.","**Il revient** si ça a marché : un client satisfait recrute à nouveau à la saison suivante."]}]},{id:"sbs-methode",titre:"La conversation de vente, étape par étape",blocs:[{type:"p",texte:"**L'idée clé : on comprend avant de proposer.** Avec une petite entreprise, tout tient souvent en un ou deux appels. Les étapes restent les mêmes, elles vont juste plus vite."},{type:"liste",ordonnee:!0,items:["**Ouvrir** : une accroche courte, centrée sur le client et son poste à pourvoir, pas sur Indeed. Montre vite que tu connais son métier.","**Découvrir** : poser des questions ouvertes pour comprendre son problème et ce qu'il lui coûte (voir la section suivante).","**Reformuler** : redire son problème avec ses mots. « Si je comprends bien, sans cuisinier d'ici un mois, vous fermez le lundi. »","**Recommander** : une solution simple, reliée à son problème, avec ce qu'elle lui apporte concrètement.","**Répondre aux objections** : avec calme, en posant une question avant de répondre (voir plus bas).","**Conclure** : obtenir une décision ou, au minimum, une prochaine étape datée.","**Suivre** : rappeler quelques jours plus tard pour regarder les résultats et ajuster."]},{type:"encadre",ton:"attention",titre:"L'erreur la plus fréquente",items:["Présenter le produit dès la première minute. Le client décroche, et tu ne sais pas encore ce dont il a besoin."]}]},{id:"sbs-decouverte",titre:"La découverte : les bonnes questions",blocs:[{type:"p",texte:"**L'idée clé : quatre thèmes suffisent pour comprendre le besoin d'un recruteur : le temps, le coût, la qualité et le volume.** Prépare une ou deux questions pour chacun."},{type:"tableau",colonnes:["Thème","Questions à poser"],lignes:[["**Le temps**","« Pour quand avez-vous besoin de cette personne ? » « Depuis combien de temps cherchez-vous ? »"],["**Le coût**","« Qu'est-ce que ce poste vide vous coûte aujourd'hui ? » « Que se passe-t-il s'il n'est pas pourvu ce mois-ci ? »"],["**La qualité**","« Pour vous, c'est quoi un bon candidat pour ce poste ? » « Quels critères sont non négociables ? »"],["**Le volume**","« Combien de personnes cherchez-vous, et où ? » « Où avez-vous trouvé vos meilleurs salariés jusqu'ici ? »"]]},{type:"liste",titre:"Les deux questions qui ouvrent tout",items:["« Si vous pouviez régler un seul problème dans votre façon de recruter, ce serait lequel ? »","« Dans un mois, qu'est-ce qui vous ferait dire que ça a marché ? » Cette réponse devient ton critère de réussite avec lui."]},{type:"encadre",ton:"conseil",titre:"Comment bien écouter",items:["Une question à la fois, puis tu te tais.","Fais chiffrer l'impact par le client lui-même : c'est plus convaincant que si tu l'affirmes.","Note ses mots exacts : tu les réutiliseras pour recommander."]}]},{id:"sbs-objections",titre:"Répondre aux objections",blocs:[{type:"p",texte:"**L'idée clé : une objection est une question cachée, pas un refus.** Même méthode à chaque fois, en trois temps."},{type:"liste",ordonnee:!0,items:["**Accueillir et reformuler** : « Je comprends, c'est une vraie question. » Ne contredis pas.","**Creuser puis répondre** : une question pour comprendre ce qu'il y a derrière, puis un fait simple.","**Relancer** : proposer une prochaine étape concrète, souvent un essai court et sans engagement."]},{type:"p",texte:"Les objections les plus courantes et des réponses prêtes sont dans la partie 4."}]},{id:"sbs-suivi",titre:"Après la vente : suivre et développer",blocs:[{type:"p",texte:"**L'idée clé : avec un petit client, la valeur vient de la durée.** Une vente n'est réussie que si le client recrute, et revient."},{type:"liste",items:["**Rappeler après quelques jours** pour regarder les candidatures reçues avec lui.","**Ajuster** si besoin : l'annonce, le budget, les critères.","**Fêter le résultat** quand le poste est pourvu, et demander un retour.","**Anticiper le prochain besoin** : la saison, un départ, un nouvel établissement.","**Demander une recommandation** à un client satisfait."]}]},{id:"sbs-profil",titre:"Le profil recherché",blocs:[{type:"p",texte:"**L'idée clé : on cherche quelqu'un d'à l'aise au téléphone, qui écoute avant de vendre et qui tient le rythme.** Les offres publiques de l'équipe parlent d'une approche de conseil qui part du besoin du client, d'aisance avec beaucoup d'appels sortants, de résilience [s:sbs-activation-2026], d'assurance et d'empathie [s:sbs-activation-it]. Les résultats sont suivis chaque trimestre [s:sbs-activation-2026]."},{type:"duo",gauche:{titre:"Ce qu'ils vont vérifier",items:["**L'aisance au téléphone**, sur beaucoup d'appels par jour.","**La résilience** : beaucoup de refus, et la façon de rebondir.","**L'écoute** : poser les bonnes questions avant de proposer.","**L'organisation** : suivre beaucoup de petits clients sans oublier de relance.","**Le goût du chiffre** : connaître ses résultats et les expliquer.","**L'envie d'apprendre** : des produits qui changent vite."]},droite:{titre:"Ce que tu prépares pour le prouver",items:["Tes résultats en chiffres : objectif, atteinte, nombre de clients.","Une vente difficile gagnée, et une perdue avec ce que tu en as appris.","Ta façon d'organiser ta semaine et tes relances.","Un exemple où tu as appris vite un nouveau produit ou un nouvel outil.","Ce que tu sais des petites entreprises : clients, proches, expériences."]}}]}]},ae=[Wp,
